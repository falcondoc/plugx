name: Update PlugX Playlist

on:
  schedule:
    # every 6 hours (token window is ~6h)
    - cron: "0 */4 * * *"
  workflow_dispatch: # manual run button
  push:
    branches:
      - main
    paths:
      - "script/generate_plugx.py"
      - ".github/workflows/update-playlist.yml"

concurrency:
  group: update-plugx-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate playlist
        run: python script/generate_plugx.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add plugx.m3u .last_check
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update plugx.m3u: $(date -u +'%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push failed, retrying ($i)..."
            sleep $((RANDOM % 8 + 2))
          done
